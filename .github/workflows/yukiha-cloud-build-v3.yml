name: YUKIHA Adachi Cloud Build

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    paths:
      - 'yukiha/source.zip.b64'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || startsWith(github.event.issue.title, '[YUKIHA V3]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Build encrypt and package
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:GITHUB_WORKSPACE 'YUKIHA_BUILD_LOG.txt'
          function L($s){ $s | Tee-Object -FilePath $log -Append }
          try {
            L "START $(Get-Date -Format o)"
            $b64=(Get-Content (Join-Path $env:GITHUB_WORKSPACE 'yukiha\source.zip.b64') -Raw).Trim()
            $zip=Join-Path $env:GITHUB_WORKSPACE 'source.zip'
            [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
            $src=Join-Path $env:GITHUB_WORKSPACE 'source'
            Expand-Archive $zip -DestinationPath $src -Force
            $pack=Join-Path $src 'adachi_rei'
            L "PACK=$pack"
            Get-ChildItem -Recurse $pack | ForEach-Object { L ("PRE {0} {1}" -f $_.Name,$_.Length) }

            $tool=Join-Path $env:GITHUB_WORKSPACE 'tool'
            New-Item -ItemType Directory -Force -Path $tool | Out-Null
            $base='https://raw.githubusercontent.com/NoahKuowithme/Minecraft-bedrock-skins-persona-/main/tool%20for%20mcpe%20persona/'
            foreach($f in @('encryptor.exe','Encryptor.exe.config','LibMcCrypt.dll','Newtonsoft.Json.dll')){
              Invoke-WebRequest -UseBasicParsing ($base+$f) -OutFile (Join-Path $tool $f)
            }

            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=Join-Path $tool 'encryptor.exe'
            $psi.WorkingDirectory=$tool
            $psi.UseShellExecute=$false
            $psi.RedirectStandardInput=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $p=New-Object System.Diagnostics.Process
            $p.StartInfo=$psi
            [void]$p.Start()
            $p.StandardInput.WriteLine($pack)
            $p.StandardInput.Close()
            if(-not $p.WaitForExit(20000)){ try{$p.Kill()}catch{}; throw 'encryptor timeout' }
            L "EXIT=$($p.ExitCode)"
            L ("STDOUT="+$p.StandardOutput.ReadToEnd())
            L ("STDERR="+$p.StandardError.ReadToEnd())
            if($p.ExitCode -ne 0){ throw 'encryptor failed' }
            if(-not (Test-Path (Join-Path $pack 'contents.json'))){ throw 'contents.json missing' }
            Get-ChildItem -Recurse $pack | ForEach-Object { L ("POST {0} {1}" -f $_.Name,$_.Length) }

            $art=Join-Path $env:GITHUB_WORKSPACE 'artifacts'
            New-Item -ItemType Directory -Force -Path $art | Out-Null
            $expanded=Join-Path $art 'YUKIHA_V7_SAFE_4D_PACK'
            if(Test-Path $expanded){ Remove-Item $expanded -Recurse -Force }
            Copy-Item $pack $expanded -Recurse -Force

            $cache=Join-Path $art '-DBZgXOP7oQ='
            $minimal=Join-Path $art 'YUKIHA_V7_SAFE_4D_iOS_MINIMAL.zip'
            if(Test-Path $cache){ Remove-Item $cache -Force }
            if(Test-Path $minimal){ Remove-Item $minimal -Force }
            $code="import sys,zipfile,pathlib; src=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); outer=pathlib.Path(sys.argv[3]); z=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(src).as_posix()) for p in sorted(src.rglob('*')) if p.is_file()]; z.close(); z=zipfile.ZipFile(outer,'w',zipfile.ZIP_DEFLATED); z.write(out,'skin_packs/-DBZgXOP7oQ='); z.close()"
            python -c $code $pack $cache $minimal
            if($LASTEXITCODE -ne 0){ throw 'cache packaging failed' }
            $check="import sys,zipfile,json; p=sys.argv[1]; z=zipfile.ZipFile(p); n=z.namelist(); req={'manifest.json','contents.json','signatures.json','geometry.json','skins.json','skin_0.png'}; assert req.issubset(set(n)); assert all('\\' not in x for x in n); print('CACHE_OK',len(n),n)"
            python -c $check $cache | Tee-Object -FilePath $log -Append
            if($LASTEXITCODE -ne 0){ throw 'cache validation failed' }

            $enc=[Convert]::ToBase64String([IO.File]::ReadAllBytes($cache))
            $chunk=2500
            for($i=0; $i -lt 4; $i++){
              $start=$i*$chunk
              $len=[Math]::Min($chunk,[Math]::Max(0,$enc.Length-$start))
              $part=if($len -gt 0){$enc.Substring($start,$len)}else{''}
              Set-Content -Path (Join-Path $art ("YOUNG_GRU_CACHE_B64_{0}.txt" -f ($i+1))) -Value $part -NoNewline
            }
            L ("CACHE_B64_LEN="+$enc.Length)
            L ('RAW_CACHE_SHA256='+(Get-FileHash $cache -Algorithm SHA256).Hash)
            L ('MINIMAL_SHA256='+(Get-FileHash $minimal -Algorithm SHA256).Hash)
            L 'RESULT=SUCCESS'
          } catch {
            L ("EXCEPTION="+$_.Exception.ToString())
          }

      - name: Publish result
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if(Test-Path YUKIHA_BUILD_LOG.txt){ Copy-Item YUKIHA_BUILD_LOG.txt artifacts/YUKIHA_BUILD_LOG.txt -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'Publish YUKIHA cloud build result'
          if($LASTEXITCODE -ne 0){ Write-Host 'No changes to commit' }
          git pull --rebase
          if($LASTEXITCODE -ne 0){ throw 'git pull --rebase failed' }
          git push
          if($LASTEXITCODE -ne 0){ throw 'git push failed' }
