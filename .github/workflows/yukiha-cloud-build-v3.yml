name: YUKIHA Adachi Cloud Build

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[YUKIHA V3]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Build and diagnose
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:GITHUB_WORKSPACE 'YUKIHA_BUILD_LOG.txt'
          function L($s){ $s | Tee-Object -FilePath $log -Append }
          try {
            L "START $(Get-Date -Format o)"
            $b64=(Get-Content (Join-Path $env:GITHUB_WORKSPACE 'yukiha\source.zip.b64') -Raw).Trim()
            $zip=Join-Path $env:GITHUB_WORKSPACE 'source.zip'
            [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
            $src=Join-Path $env:GITHUB_WORKSPACE 'source'
            Expand-Archive $zip -DestinationPath $src -Force
            $pack=Join-Path $src 'adachi_rei'
            L "PACK=$pack"
            Get-ChildItem -Recurse $pack | ForEach-Object { L ("PRE  {0} {1}" -f $_.FullName,$_.Length) }

            $tool=Join-Path $env:GITHUB_WORKSPACE 'tool'
            New-Item -ItemType Directory -Force -Path $tool | Out-Null
            $base='https://raw.githubusercontent.com/NoahKuowithme/Minecraft-bedrock-skins-persona-/main/tool%20for%20mcpe%20persona/'
            foreach($f in @('encryptor.exe','Encryptor.exe.config','LibMcCrypt.dll','Newtonsoft.Json.dll')){
              $u=$base+$f; L "GET $u"; Invoke-WebRequest -UseBasicParsing $u -OutFile (Join-Path $tool $f)
            }

            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=Join-Path $tool 'encryptor.exe'
            $psi.WorkingDirectory=$tool
            $psi.UseShellExecute=$false
            $psi.RedirectStandardInput=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $p=New-Object System.Diagnostics.Process
            $p.StartInfo=$psi
            [void]$p.Start()
            $p.StandardInput.WriteLine($pack)
            $p.StandardInput.Close()
            if(-not $p.WaitForExit(20000)){
              L 'PROCESS_TIMEOUT_AFTER_20S'
              try { $p.Kill() } catch {}
              $p.WaitForExit()
            }
            $out=$p.StandardOutput.ReadToEnd()
            $err=$p.StandardError.ReadToEnd()
            L "EXIT=$($p.ExitCode)"
            L "STDOUT:`n$out"
            L "STDERR:`n$err"
            Get-ChildItem -Recurse $pack | ForEach-Object { L ("POST {0} {1}" -f $_.FullName,$_.Length) }

            if(Test-Path (Join-Path $pack 'contents.json')){
              $art=Join-Path $env:GITHUB_WORKSPACE 'artifacts'
              New-Item -ItemType Directory -Force -Path $art | Out-Null

              $expanded=Join-Path $art 'YUKIHA_V6_FIXED_PACK'
              if(Test-Path $expanded){ Remove-Item $expanded -Recurse -Force }
              Copy-Item $pack $expanded -Recurse -Force

              $finaldir=Join-Path $art 'YUKIHA_V6_FIXED_FINAL'
              if(Test-Path $finaldir){ Remove-Item $finaldir -Recurse -Force }
              New-Item -ItemType Directory -Force -Path $finaldir | Out-Null
              $cache=Join-Path $finaldir '-DBZgXOP7oQ='
              $minimal=Join-Path $art 'YUKIHA_V6_FIXED_iOS_MINIMAL.zip'
              if(Test-Path $minimal){ Remove-Item $minimal -Force }

              $py=@'
import sys, zipfile
from pathlib import Path
src=Path(sys.argv[1])
out=Path(sys.argv[2])
outer=Path(sys.argv[3])
with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
    for p in sorted(src.rglob('*')):
        if p.is_file():
            z.write(p,p.relative_to(src).as_posix())
with zipfile.ZipFile(outer,'w',zipfile.ZIP_DEFLATED) as z:
    z.write(out,'skin_packs/-DBZgXOP7oQ=')
with zipfile.ZipFile(out,'r') as z:
    names=z.namelist()
    req={'manifest.json','contents.json','signatures.json','geometry.json','skins.json','skin_0.png'}
    assert req.issubset(names), (req-set(names))
    assert all('\\' not in n for n in names)
print('CACHE_OK', out.stat().st_size, names)
'@
              $pyscript=Join-Path $env:GITHUB_WORKSPACE 'make_ios_cache.py'
              Set-Content -Path $pyscript -Value $py -Encoding UTF8
              python $pyscript $pack $cache $minimal | Tee-Object -FilePath $log -Append
              if($LASTEXITCODE -ne 0){ throw 'iOS cache packaging failed' }

              L ('RAW_CACHE_SHA256='+(Get-FileHash $cache -Algorithm SHA256).Hash)
              L ('MINIMAL_SHA256='+(Get-FileHash $minimal -Algorithm SHA256).Hash)
              L 'RESULT=SUCCESS'
            } else {
              L 'RESULT=FAILED_NO_CONTENTS_JSON'
            }
          } catch {
            L ("EXCEPTION="+$_.Exception.ToString())
          }

      - name: Publish log/result
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if(Test-Path YUKIHA_BUILD_LOG.txt){ Copy-Item YUKIHA_BUILD_LOG.txt artifacts/YUKIHA_BUILD_LOG.txt -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'Publish corrected YUKIHA V6 iOS cache'
          if($LASTEXITCODE -ne 0){ Write-Host 'No changes to commit' }
          git pull --rebase
          if($LASTEXITCODE -ne 0){ throw 'git pull --rebase failed' }
          git push
          if($LASTEXITCODE -ne 0){ throw 'git push failed' }
