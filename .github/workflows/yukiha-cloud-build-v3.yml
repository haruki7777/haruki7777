name: YUKIHA Adachi Cloud Build

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[YUKIHA V3]')
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Build and diagnose
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:GITHUB_WORKSPACE 'YUKIHA_BUILD_LOG.txt'
          function L($s){ $s | Tee-Object -FilePath $log -Append }
          try {
            L "START $(Get-Date -Format o)"
            $b64=(Get-Content (Join-Path $env:GITHUB_WORKSPACE 'yukiha\source.zip.b64') -Raw).Trim()
            $zip=Join-Path $env:GITHUB_WORKSPACE 'source.zip'
            [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
            $src=Join-Path $env:GITHUB_WORKSPACE 'source'
            Expand-Archive $zip -DestinationPath $src -Force
            $pack=Join-Path $src 'adachi_rei'
            L "PACK=$pack"
            Get-ChildItem -Recurse $pack | ForEach-Object { L ("PRE  {0} {1}" -f $_.FullName,$_.Length) }

            $tool=Join-Path $env:GITHUB_WORKSPACE 'tool'
            New-Item -ItemType Directory -Force -Path $tool | Out-Null
            $base='https://raw.githubusercontent.com/NoahKuowithme/Minecraft-bedrock-skins-persona-/main/tool%20for%20mcpe%20persona/'
            foreach($f in @('encryptor.exe','Encryptor.exe.config','LibMcCrypt.dll','Newtonsoft.Json.dll')){
              $u=$base+$f; L "GET $u"; Invoke-WebRequest -UseBasicParsing $u -OutFile (Join-Path $tool $f)
            }
            Get-ChildItem $tool | ForEach-Object { L ("TOOL {0} {1}" -f $_.Name,$_.Length) }

            $psi=New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName=Join-Path $tool 'encryptor.exe'
            $psi.WorkingDirectory=$tool
            $psi.UseShellExecute=$false
            $psi.RedirectStandardInput=$true
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $p=New-Object System.Diagnostics.Process
            $p.StartInfo=$psi
            [void]$p.Start()
            $p.StandardInput.WriteLine($pack)
            $p.StandardInput.Close()
            if(-not $p.WaitForExit(20000)){
              L 'PROCESS_TIMEOUT_AFTER_20S'
              try { $p.Kill() } catch {}
              $p.WaitForExit()
            }
            $out=$p.StandardOutput.ReadToEnd()
            $err=$p.StandardError.ReadToEnd()
            L "EXIT=$($p.ExitCode)"
            L "STDOUT:`n$out"
            L "STDERR:`n$err"
            Get-ChildItem -Recurse $pack | ForEach-Object { L ("POST {0} {1}" -f $_.FullName,$_.Length) }

            if(Test-Path (Join-Path $pack 'contents.json')){
              New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts') | Out-Null
              $expanded=Join-Path $env:GITHUB_WORKSPACE 'artifacts\YUKIHA_V6_FIXED_PACK'
              if(Test-Path $expanded){ Remove-Item $expanded -Recurse -Force }
              Copy-Item $pack $expanded -Recurse -Force
              Compress-Archive -Path $pack -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\YUKIHA_ADACHI_iOS_READY.zip') -Force
              L 'RESULT=SUCCESS'
            } else {
              L 'RESULT=FAILED_NO_CONTENTS_JSON'
            }
          } catch {
            L ("EXCEPTION="+$_.Exception.ToString())
          }

      - name: Publish log/result
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if(Test-Path YUKIHA_BUILD_LOG.txt){ Copy-Item YUKIHA_BUILD_LOG.txt artifacts/YUKIHA_BUILD_LOG.txt -Force }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts
          git commit -m 'Publish YUKIHA Adachi build result'
          if($LASTEXITCODE -ne 0){ Write-Host 'No changes to commit' }
          git pull --rebase
          if($LASTEXITCODE -ne 0){ throw 'git pull --rebase failed' }
          git push
          if($LASTEXITCODE -ne 0){ throw 'git push failed' }
