name: YUKIHA Upload Existing Artifact

on:
  issues:
    types: [opened]

permissions:
  contents: write

actions:

jobs:
  export:
    if: startsWith(github.event.issue.title, '[YUKIHA GET]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record run id
        run: |
          echo "RUN_ID=${{ github.run_id }}" > artifacts/YUKIHA_GET_RUN.txt
          echo "COMMIT=${{ github.sha }}" >> artifacts/YUKIHA_GET_RUN.txt
      - name: Upload encrypted pack
        uses: actions/upload-artifact@v4
        with:
          name: YUKIHA_ANIMALFRIENDS_ENCRYPTED
          path: artifacts/YUKIHA_ADACHI_iOS_READY.zip
          if-no-files-found: error
      - name: Publish run id marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/YUKIHA_GET_RUN.txt
          git commit -m 'Record YUKIHA artifact run id [skip ci]' || true
          git pull --rebase
          git push
