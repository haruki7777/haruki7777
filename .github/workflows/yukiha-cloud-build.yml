name: YUKIHA 4D Cloud Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP_B64: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Recreate source pack
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'source.zip'), [Convert]::FromBase64String($env:SOURCE_ZIP_B64))
          Expand-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'source.zip') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Force
          Get-ChildItem -Recurse (Join-Path $env:GITHUB_WORKSPACE 'source') | Select-Object FullName,Length

      - name: Download public persona encryptor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tool=Join-Path $env:GITHUB_WORKSPACE 'tool'
          New-Item -ItemType Directory -Force -Path $tool | Out-Null
          $base='https://raw.githubusercontent.com/NoahKuowithme/Minecraft-bedrock-skins-persona-/main/tool%20for%20mcpe%20persona/'
          foreach($f in @('encryptor.exe','Encryptor.exe.config','LibMcCrypt.dll','Newtonsoft.Json.dll')) { Invoke-WebRequest -UseBasicParsing ($base+$f) -OutFile (Join-Path $tool $f) }
          Get-ChildItem $tool | Select-Object Name,Length

      - name: Encrypt 4D pack
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pack=Join-Path $env:GITHUB_WORKSPACE 'source\TYCS5JgTMvc='
          $tool=Join-Path $env:GITHUB_WORKSPACE 'tool'
          Push-Location $tool
          try {
            $pack | & .\encryptor.exe
            if($LASTEXITCODE -ne 0){ throw "encryptor exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          Get-ChildItem -Recurse $pack | Select-Object FullName,Length
          if(-not (Test-Path (Join-Path $pack 'contents.json'))){ throw 'contents.json not generated' }

      - name: Package iOS-ready ZIP
        shell: powershell
        run: |
          $pack=Join-Path $env:GITHUB_WORKSPACE 'source\TYCS5JgTMvc='
          $out=Join-Path $env:GITHUB_WORKSPACE 'YUKIHA_4D_iOS_READY.zip'
          Compress-Archive -Path $pack -DestinationPath $out -Force
          Get-Item $out | Select-Object FullName,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YUKIHA_4D_iOS_READY
          path: YUKIHA_4D_iOS_READY.zip
          if-no-files-found: error
          retention-days: 7
