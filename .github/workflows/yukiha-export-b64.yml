name: YUKIHA Export Built ZIP as Chunks

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  export:
    if: startsWith(github.event.issue.title, '[YUKIHA EXPORT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split latest built ZIP into base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          src='artifacts/YUKIHA_ADACHI_iOS_READY.zip'
          test -f "$src"
          rm -rf artifacts/export
          mkdir -p artifacts/export
          b64=$(base64 -w 0 "$src")
          len=${#b64}
          chunk=2500
          n=0
          for ((i=0;i<len;i+=chunk)); do
            n=$((n+1))
            printf '%s' "${b64:i:chunk}" > "artifacts/export/chunk$(printf '%02d' $n).txt"
          done
          sha=$(sha256sum "$src" | awk '{print $1}')
          bytes=$(stat -c%s "$src")
          printf 'chunks=%s\nbase64_length=%s\nzip_bytes=%s\nsha256=%s\n' "$n" "$len" "$bytes" "$sha" > artifacts/export/manifest.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/export
          git commit -m 'Export YUKIHA ZIP as base64 chunks [skip ci]'
          git pull --rebase
          git push
